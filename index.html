<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="./src/output.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>

    <title>Website project template</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap" rel="stylesheet">

<body class="overflow-x-hidden">

    

    <div  id="navbar" class="sticky top-0 bg-transparent z-100 max-lg:mb-60"></div>
    <div class="text-red-900" id="header"></div>
    <div  id="hero"></div>
    <div id="services"></div>


<body>
    <div id="header"></div>
    <div id="hero"></div>
   
    <div id="footer"></div>
    <script defer src="/src/js/nav.js"></script>
    <script>
        const loadComponents = (id, url) =>  {
            return fetch(url)
            .then((response) => response.text())
            .then((html) => {
                document.getElementById(id).innerHTML = html;
            });
        }

        window.onload = async () => {
            // load navbar first so scripts can attach
            await loadComponents('navbar', 'src/sections/navBar.html');
            // init nav handlers that expect elements inside the injected navbar
            if (window.initNav) window.initNav();

            // load the rest (can be async)
            loadComponents('header', 'src/sections/header.html');
            loadComponents('hero', 'src/sections/hero.html');
            loadComponents('services', 'src/sections/service.html');
           
            loadComponents('footer', 'src/sections/footer.html');
        }
    </script>

     
    </body>

</html>
